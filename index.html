<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Management System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
}

nav{
background:#007BFF;
padding:15px 50px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:24px;
font-weight:bold;
}

nav ul{
list-style:none;
display:flex;
gap:20px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

.hero{
text-align:center;
padding:60px 20px;
background:linear-gradient(to right,#007BFF,#00c6ff);
color:white;
}

.hero h1{
font-size:48px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
}

.container{
max-width:700px;
margin:40px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.container h2{
margin-bottom:20px;
text-align:center;
}

input,select,button{
width:100%;
padding:15px;
margin-top:15px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

button{
background:#007BFF;
color:white;
border:none;
cursor:pointer;
font-size:18px;
}

button:hover{
background:#0056b3;
}

#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:green;
text-align:center;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:50px;
}
</style>
</head>

<body>

<nav>
<div class="logo">Tax System</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="history.html">History</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<div class="hero">
<h1>Tax Calculator</h1>
<p>Fast and Accurate Tax Calculations</p>
</div>

<div class="container">

<h2>Calculate Your Tax</h2>

<input type="number" id="income" placeholder="Enter Income">

<select id="taxRate">
<option value="0.10">10% Tax</option>
<option value="0.15">15% Tax</option>
<option value="0.18">18% Tax</option>
<option value="0.30">30% Tax</option>
</select>

<button onclick="calculateTax()">Calculate Tax</button>

<div id="result"></div>

</div>

<footer>
© 2026 Tax Management System
</footer>

<script>
function calculateTax(){

let income=parseFloat(document.getElementById("income").value);
let taxRate=parseFloat(document.getElementById("taxRate").value);

if(isNaN(income)||income<=0){
document.getElementById("result").innerHTML=
"Please enter a valid income.";
return;
}

let tax=income*taxRate;
let netIncome=income-tax;

document.getElementById("result").innerHTML=
"Tax Amount: $" + tax.toFixed(2) +
"<br>Net Income: $" + netIncome.toFixed(2);
}
</script>

</body>
</html>
